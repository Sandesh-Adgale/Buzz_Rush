<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#141e33"/>
      <stop offset="100%" stop-color="#070b14"/>
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#7000ff"/>
      <stop offset="100%" stop-color="#ff0055"/>
    </linearGradient>
    <radialGradient id="buttonGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ff2a5f"/>
      <stop offset="60%" stop-color="#d90038"/>
      <stop offset="100%" stop-color="#80001f"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>

  <!-- Outer Neon Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#ring)" stroke-width="12" filter="url(#glow)" opacity="0.8"/>
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#ring)" stroke-width="6"/>

  <!-- Buzzer Base -->
  <circle cx="256" cy="256" r="150" fill="#0f172a" stroke="#334155" stroke-width="4"/>

  <!-- Glowing Dome -->
  <circle cx="256" cy="252" r="120" fill="url(#buttonGlow)" filter="url(#glow)"/>

  <!-- Lightning Bolt Emblem -->
  <path d="M268 160L216 264H260L236 344L316 236H268L292 160H268Z" fill="#ffffff" filter="url(#glow)"/>
  <path d="M268 160L216 264H260L236 344L316 236H268L292 160H268Z" fill="#ffffff"/>
</svg>
